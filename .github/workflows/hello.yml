name: Hello

on:
  push:
    branches: ["main"]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "hello from CI"

      - name: Who am I running on?
        run: |
          uname -a
          whoami
          nproc
          free -h

      - name: This will fail
        run: |
          echo "about to fail..."
          ls /nope
          echo "you will never see this line"

      - name: Where am I?
        run: |
          pwd
          ls -la

